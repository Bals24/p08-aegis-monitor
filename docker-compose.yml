services:
  # === BACKEND API (FastAPI) ===
  backend:
    build: ./backend
    container_name: aegis-backend
    ports:               
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aegis:aegis@postgres:5432/aegis
      - PROMETHEUS_URL=http://prometheus:9090
      - OLLAMA_URL=http://ollama:11434
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=aegis
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    depends_on:
      - postgres
      - prometheus
    networks:
      - aegis-net
    restart: unless-stopped

  # === BASE DE DONNÉES ===
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aegis-net

  # === MÉTRIQUES (Prometheus) ===
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: aegis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - aegis-net

  # === VISUALISATION (Grafana) ===
  grafana:
    image: grafana/grafana:10.4.1
    container_name: aegis-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafdata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - aegis-net

  # === ALERTES ===
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: aegis-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - aegis-net

  # === IA LOCALE (Ollama) ===
  ollama:
    image: ollama/ollama:latest
    container_name: aegis-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - aegis-net

  # === IAM (Keycloak) ===
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: aegis-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-admin}
    ports:
      - "8080:8080"
    networks:
      - aegis-net

  # === REVERSE PROXY HTTPS (Caddy) ===
  caddy:
    image: caddy:2-alpine
    container_name: aegis-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - grafana
    networks:
      - aegis-net

volumes:
  pgdata:
  promdata:
  grafdata:
  ollama_data:
  caddy_data:
  caddy_config:

networks:
  aegis-net:
    driver: bridge