name: CI/CD Aegis Monitor

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest black ruff bandit

      - name: Lint (ruff)
        run: cd backend && ruff check app/

      - name: Format check (black)
        run: cd backend && black --check app/

      - name: Security scan (bandit)
        run: cd backend && bandit -r app/ -ll

      - name: Tests
        run: cd backend && pytest tests/

      - name: Build Docker image
        run: docker build -t aegis-backend:latest ./backend

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aegis-backend:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH