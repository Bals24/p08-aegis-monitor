<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Monitor - Statut des Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
        <!-- Header -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6 border-l-4 border-blue-600">
            <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                🛡️ Aegis Monitor <span class="text-sm font-normal text-gray-500 bg-gray-100 px-2 py-1 rounded">Statut des Services</span>
            </h1>
            <p class="text-gray-600 mt-2">Surveillance en temps réel de la disponibilité et des performances de nos services critiques.</p>
            <div class="mt-4 flex items-center gap-2 text-sm text-gray-500">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                Tous les systèmes opérationnels (Actualisation auto toutes les 15s)
            </div>
        </div>

        <!-- Services List -->
        <div id="services-list" class="space-y-4">
            <div class="bg-white rounded-xl shadow-sm p-8 text-center text-gray-500">Chargement des données...</div>
        </div>

        <!-- Footer -->
        <div class="text-center text-gray-400 text-sm mt-8">
            Propulsé par <span class="font-semibold text-gray-600">Aegis Monitor</span> (Projet P08 ESTI)
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('http://localhost:8000/api/sites');
                const sites = await response.json();
                const container = document.getElementById('services-list');
                container.innerHTML = '';
                
                sites.forEach(site => {
                    const isUp = site.status === 'UP';
                    const statusColor = isUp ? 'bg-green-100 text-green-800 border-green-200' : 'bg-red-100 text-red-800 border-red-200';
                    const statusDot = isUp ? 'bg-green-500' : 'bg-red-500 animate-pulse';
                    const latencyText = site.response_time_ms ? `${site.response_time_ms} ms` : 'N/A';
                    const errorText = site.error ? `<div class="text-xs text-red-600 mt-1 font-mono">⚠️ ${site.error} (Échecs: ${site.consecutive_failures})</div>` : '';

                    const div = document.createElement('div');
                    div.className = 'bg-white rounded-xl shadow-sm p-5 border border-gray-100 hover:shadow-md transition-shadow';
                    div.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-semibold text-gray-900 text-lg">${site.name}</h3>
                                <a href="${site.url}" target="_blank" class="text-sm text-blue-600 hover:underline break-all">${site.url}</a>
                                ${errorText}
                            </div>
                            <div class="text-right">
                                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-sm font-medium border ${statusColor}">
                                    <span class="w-2 h-2 rounded-full ${statusDot}"></span>
                                    ${site.status}
                                </span>
                                <div class="text-xs text-gray-500 mt-2">Latence: <span class="font-mono font-medium">${latencyText}</span></div>
                                <div class="text-xs text-gray-400">Dernier check: ${site.last_checked_at ? new Date(site.last_checked_at).toLocaleTimeString() : 'Jamais'}</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                document.getElementById('services-list').innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-xl p-6 text-center text-red-700">
                        Impossible de joindre l'API de monitoring. Vérifiez que le backend est en cours d'exécution.
                    </div>`;
            }
        }
        fetchStatus();
        setInterval(fetchStatus, 15000);
    </script>
</body>
</html>
