global:
  scrape_interval: 15s
  evaluation_interval: 15s

# C'est ce bloc qui envoie les alertes à Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# C'est ce bloc qui charge les règles
rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'aegis-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']